{% load static %}
<!DOCTYPE html>
<html lang="ru">
 <head>
    <meta charset="UTF-8">
    <title>Регистрация - Django Public Blog</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
 </head>
 <body class="auth-page">
    <div class="header">
        <img src="{% static 'img/dpb-logo.png' %}" alt="Логотип" />
    </div>
    
    <div class="auth-container">
        <h1>Регистрация</h1>
        
        {% if form.errors %}
        <div class="form-errors">{{ form.errors }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Имя пользователя" value="{{ form.username|default:'' }}" required>
            <input type="email" name="email" placeholder="Email" value="{{ form.email|default:'' }}" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="password" name="password_confirm" placeholder="Подтвердите пароль" required>
            <input type="submit" value="Зарегистрироваться">
        </form>
        
        <p class="auth-link">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        <a href="{% url 'archive' %}" class="back-link">← Назад к архиву</a>
    </div>
 </body>
</html>
